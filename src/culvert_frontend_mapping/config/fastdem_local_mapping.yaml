# FastDEM ROS Configuration for culvert robot local traversability preview
topics:
  input_scans: ["/fastlio2/body_cloud"]
  publish_rate: 10.0
  post_process_rate: 10.0

tf:
  base_frame: "base_link"
  map_frame: "odom"
  max_wait_time: 0.5
  max_stale_time: 0.5

map:
  width: 12.0
  height: 12.0
  resolution: 0.1

point_filter:
  z_min: -0.5
  z_max: 2.0
  range_min: 0.3
  range_max: 25.0

logger:
  level: "info"

mapping:
  mode: "local"
  type: "kalman_filter"
  kalman:
    min_variance: 0.0001
    max_variance: 0.02
    process_noise: 0.0
  p2:
    dn0: 0.0
    dn1: 0.16
    dn2: 0.50
    dn3: 0.84
    dn4: 1.0
    elevation_marker: 3
    max_sample_count: 0

sensor_model:
  type: "lidar"
  lidar:
    range_noise: 0.02
    angular_noise: 0.001
  rgbd:
    normal_a: 0.001
    normal_b: 0.002
    normal_c: 0.4
    lateral_factor: 0.001
  constant:
    uncertainty: 0.03

raycasting:
  enabled: true
  height_conflict_threshold: 0.05
  log_odds_observed: 0.4
  log_odds_ghost: 0.2
  log_odds_max: 2.0
  clear_threshold: -1.0

inpainting:
  enabled: true
  max_iterations: 3
  min_valid_neighbors: 2

uncertainty_fusion:
  enabled: false
  search_radius: 0.15
  spatial_sigma: 0.05
  quantile_lower: 0.01
  quantile_upper: 0.99
  min_valid_neighbors: 3

feature_extraction:
  enabled: false
  analysis_radius: 0.3
  min_valid_neighbors: 4
  step_lower_percentile: 0.05
  step_upper_percentile: 0.95

visualization:
  feature_extraction:
    normals:
      arrow_length: 0.15
      stride: 3
